about:
  en:
    - "I build backend systems for banks and large companies. Over the last 10 years that has meant an investment platform for BR Partners, a data product built from scratch for Itaú, a delivery system for Grupo Boticário and a public-safety data platform with billions of records for Brazil's Ministry of Justice."
    - "Most of my work runs on the JVM (Java, Kotlin, Spring Boot, Quarkus), with Kafka and RabbitMQ between services and AWS, Docker and Kubernetes underneath. I've also done my share of data engineering (Spark, Airflow, Python), frontend (React, Angular) and native mobile."
    - "Lately I've been putting AI to work inside the engineering process itself. At BR Partners I'm building an agentic system with RAG that helps plan tasks, write and maintain code, and review pull requests in CI. A workload that used to need five developers now takes three. Before that, at Itaú, I took the data science team's machine learning models to production."
    - "I also run Falcao SL, a small studio where I ship native apps for macOS, iOS and Android, plus backend systems and AI automation, on infrastructure I manage as code."
  pt:
    - "Construo sistemas backend para bancos e grandes empresas. Nos últimos 10 anos, isso significou uma plataforma de investimentos para o BR Partners, um produto de dados criado do zero para o Itaú, um sistema de gestão de entregas para o Grupo Boticário e uma plataforma de dados de segurança pública com bilhões de registros para o Ministério da Justiça."
    - "A maior parte do meu trabalho roda na JVM (Java, Kotlin, Spring Boot, Quarkus), com Kafka e RabbitMQ entre os serviços e AWS, Docker e Kubernetes por baixo. Também já fiz bastante engenharia de dados (Spark, Airflow, Python), frontend (React, Angular) e mobile nativo."
    - "Ultimamente tenho colocado a IA para trabalhar dentro do próprio processo de engenharia. No BR Partners estou construindo um sistema agêntico com RAG que ajuda a planejar tarefas, escrever e manter código e revisar pull requests no CI. Uma demanda que antes precisava de cinco desenvolvedores hoje é atendida por três. Antes disso, no Itaú, levei para produção os modelos de machine learning do time de ciência de dados."
    - "Também tenho a Falcao SL, um pequeno estúdio onde publico apps nativos para macOS, iOS e Android, além de sistemas backend e automações com IA, em infraestrutura que gerencio como código."

